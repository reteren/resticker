[package]
name = "s0_overlay"
version = "0.0.0"
edition = "2024"

# S0 spike — throwaway. Proves: NOREDIRECTIONBITMAP + DirectComposition overlay
# with premultiplied alpha, click-through, WinEvent tracking, overlap mask.
# NOT part of the future crate structure (see ARCHITECTURE.md section 1).

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
] }

[profile.release]
opt-level = 2
