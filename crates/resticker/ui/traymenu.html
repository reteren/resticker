<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>resticker menu</title>
    <!-- Токены и шрифт берутся из таблицы окна настроек: меню обязано быть
         того же цвета и той же гарнитуры, что и остальная программа — ради
         этого его и переписали с системного меню Win32 на своё окно. -->
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Окно прозрачное, материал даёт акрил Windows (tauri.conf.json) —
         как у окна настроек. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      .menu {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px;
        box-sizing: border-box;
        width: max-content;
        min-width: 208px;
        border: var(--hairline) solid var(--stroke);
        border-radius: var(--radius-win);
        background: var(--glass-ink-deep);
        box-shadow:
          inset 0 1px 0 var(--rim-top),
          0 18px 40px rgba(0, 0, 0, 0.55);
        font-family: var(--font);
      }

      .item {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        padding: 6px 10px;
        border: none;
        border-radius: var(--radius-tight);
        background: transparent;
        color: var(--text);
        font: 600 12.5px var(--font);
        text-align: left;
        cursor: pointer;
        transition: background var(--t-hover) var(--ease-out);
      }

      .item:hover,
      .item:focus-visible {
        background: var(--ctrl-bg-hover);
      }

      .item:active {
        background: var(--ctrl-bg-active);
      }

      .item.danger:hover {
        background: var(--danger-bg);
        color: var(--danger-text);
      }

      .item svg {
        width: 15px;
        height: 15px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Шестерёнка нарисована заливкой — той же формы, что иконка тулбара. */
      .item svg.solid {
        fill: currentColor;
        stroke: none;
      }

      .label {
        flex: 1 1 auto;
        white-space: nowrap;
      }

      /* Значение справа от подписи (величина зазора) — второстепенное. */
      .value {
        flex: 0 0 auto;
        color: var(--text-soft);
        font-weight: 500;
      }

      /* Галочка пункта-переключателя: та же точка, что в старом меню, но
         своим цветом, а не системным. */
      .tick {
        width: 15px;
        flex: 0 0 auto;
        color: var(--text);
        text-align: center;
      }

      .tick.off {
        color: transparent;
      }

      hr {
        margin: 3px 6px;
        border: none;
        border-top: var(--hairline) solid var(--stroke-soft);
      }

      .sectionTitle {
        padding: 4px 10px 2px;
        color: var(--text-mute);
        font: 600 10.5px var(--font);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      /* Список пресетов длиннее экрана прокручивается, но полосу не рисуем:
         пунктов обычно единицы. */
      .presets {
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-height: 260px;
        overflow-y: auto;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <nav class="menu" id="menu">
      <button class="item" type="button" data-action="settings">
        <svg viewBox="0 0 24 24" class="solid" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M12 1.6l1.55 3.1 3.4-.9.55 3.45 3.45.55-.9 3.4 3.1 1.55-3.1 1.55.9 3.4-3.45.55-.55 3.45-3.4-.9L12 23.4l-1.55-3.1-3.4.9-.55-3.45-3.45-.55.9-3.4L.85 12.3l3.1-1.55-.9-3.4 3.45-.55.55-3.45 3.4.9zM12 8.4a3.9 3.9 0 100 7.8 3.9 3.9 0 000-7.8z"
          />
        </svg>
        <span class="label" data-i18n="tray.settings">Open settings</span>
      </button>

      <hr />

      <button class="item" type="button" data-action="edit-mode">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 15.5 15.1 4.4a2 2 0 0 1 2.8 0l1.7 1.7a2 2 0 0 1 0 2.8L8.5 20H4z" />
        </svg>
        <span class="label" data-i18n="tray.editMode">Edit mode</span>
      </button>

      <button class="item" type="button" data-action="toggle-visible">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M1.8 12S5.5 5.4 12 5.4 22.2 12 22.2 12 18.5 18.6 12 18.6 1.8 12 1.8 12z" />
          <circle cx="12" cy="12" r="3.1" />
        </svg>
        <span class="label" data-i18n="tray.toggleVisible">Show/hide all stickers</span>
      </button>

      <hr />

      <button class="item" type="button" data-action="snap-gap">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4.5" width="18" height="15" rx="2.2" />
          <rect x="7" y="8.5" width="10" height="7" rx="1.4" />
        </svg>
        <span class="label" data-i18n="tray.snapGap">Snap gap</span>
        <span class="value" id="snap-gap-value"></span>
      </button>

      <button class="item" type="button" data-action="snap-gap-all">
        <span class="tick off" id="snap-gap-all-tick" aria-hidden="true">•</span>
        <span class="label" data-i18n="tray.snapGapAll">All windows, not just pinned</span>
      </button>

      <div id="presets-block" hidden>
        <hr />
        <div class="sectionTitle" data-i18n="tray.presets">Presets</div>
        <div class="presets" id="presets"></div>
      </div>

      <hr />

      <button class="item danger" type="button" data-action="exit">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 4.6H6.2a1.6 1.6 0 0 0-1.6 1.6v11.6a1.6 1.6 0 0 0 1.6 1.6H9M15.4 15.6 19 12l-3.6-3.6M19 12H9.4" />
        </svg>
        <span class="label" data-i18n="tray.exit">Exit</span>
      </button>
    </nav>

    <script src="i18n.js"></script>
    <script type="module" src="traymenu.js"></script>
  </body>
</html>
