<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>resticker — настройки</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #1e1e28;
        color: #e8e8ec;
      }
      nav {
        display: flex;
        border-bottom: 1px solid #33333f;
      }
      nav button {
        flex: 1;
        padding: 0.75rem;
        background: none;
        border: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      nav button.active {
        background: #2a2a38;
        border-bottom: 2px solid #ff8c00;
      }
      section {
        display: none;
        padding: 1.5rem;
      }
      section.active {
        display: block;
      }
      button.action {
        font: inherit;
        padding: 0.5rem 1rem;
        background: #ff8c00;
        color: #1e1e28;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button.action:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #sticker-status {
        margin-top: 0.75rem;
        opacity: 0.75;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <!-- M0: пустой каркас вкладок (SPEC.md, раздел 3); M1 добавляет
         единственное действие — добавить стикер. Остальное — следующие вехи. -->
    <nav id="tabs">
      <button data-tab="stickers" class="active">Стикеры</button>
      <button data-tab="presets">Пресеты</button>
      <button data-tab="control">Управление</button>
      <button data-tab="general">Общие</button>
    </nav>
    <section id="stickers" class="active">
      <button class="action" id="add-sticker">Добавить стикер…</button>
      <div id="sticker-status"></div>
    </section>
    <section id="presets"></section>
    <section id="control"></section>
    <section id="general"></section>
    <script>
      document.getElementById('tabs').addEventListener('click', (e) => {
        const tab = e.target.dataset.tab;
        if (!tab) return;
        for (const b of document.querySelectorAll('nav button')) {
          b.classList.toggle('active', b.dataset.tab === tab);
        }
        for (const s of document.querySelectorAll('section')) {
          s.classList.toggle('active', s.id === tab);
        }
      });

      const addButton = document.getElementById('add-sticker');
      const status = document.getElementById('sticker-status');
      addButton.addEventListener('click', async () => {
        const { open } = window.__TAURI__.dialog;
        const { invoke } = window.__TAURI__.core;
        addButton.disabled = true;
        try {
          const path = await open({
            multiple: false,
            filters: [
              { name: 'Изображение', extensions: ['png', 'jpg', 'jpeg', 'webp', 'bmp'] },
            ],
          });
          if (path) {
            await invoke('add_sticker', { path });
            status.textContent = `Добавлено: ${path}`;
          }
        } catch (err) {
          status.textContent = `Ошибка: ${err}`;
        } finally {
          addButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
