[package]
name = "resticker"
description = "Desktop sticker overlay app — entry point and thread wiring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rst-core = { path = "../rst-core" }
rst-media = { path = "../rst-media" }
rst-win32 = { path = "../rst-win32" }
rst-render = { path = "../rst-render" }
rst-video = { path = "../rst-video" }
rst-audio = { path = "../rst-audio" }
anyhow = "1"
chrono = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
webview2-com = "0.38"
windows-core-61 = { package = "windows-core", version = "0.61" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

[lints]
workspace = true
