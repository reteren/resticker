[package]
name = "resticker"
description = "Desktop sticker overlay app — entry point and thread wiring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
rst-core = { path = "../rst-core" }
rst-media = { path = "../rst-media" }
rst-win32 = { path = "../rst-win32" }
rst-render = { path = "../rst-render" }
anyhow = "1"
chrono = { workspace = true }
tauri = { version = "2" }
tauri-plugin-dialog = "2"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }

[lints]
workspace = true
