[package]
name = "rst-video"
description = "FFmpeg software video decode for resticker stickers (demux/decode/resample, no GPU)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Сырые FFI-биндинги FFmpeg (bindgen на этапе сборки). Версия 7.1.x соответствует
# пресобранному FFmpeg release/7.1 (libavcodec-61 / libavformat-61 / libavutil-59 /
# libswresample-5, W:/ffmpeg_build/install). Сборка FFmpeg LGPL-only: swscale,
# avdevice, avfilter отключены — соответствующие features не включаем.
# Крейт ищет пресобранный FFmpeg по переменной окружения FFMPEG_DIR
# (см. build.rs и README.md).
ffmpeg-sys-next = { version = "=7.1.3", default-features = false, features = ["avformat", "avcodec", "swresample"] }
thiserror = { workspace = true }
tracing = { workspace = true }
# M5c: аппаратный декод D3D11VA — принимаем ID3D11Device рендера, внедряем его
# в FFmpeg hw-контекст (AddRef/Release через умные указатели) и включаем
# multithread-protection на общем девайсе (ID3D10Multithread — Direct3D10).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    # timeBeginPeriod/timeEndPeriod — точность пауз декодера (см. timer_res.rs)
    "Win32_Media",
] }

[dev-dependencies]
# Только для примера-пробника `examples/probe.rs`: он печатает журнал
# декодера в терминал, иначе диагностика не видна.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Пробнику нужен свой D3D11-девайс, чтобы проверить аппаратный декод так же,
# как это делает приложение (в приложении устройство приходит от рендера).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[lints]
workspace = true
