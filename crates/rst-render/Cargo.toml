[package]
name = "rst-render"
description = "D3D11 + DirectComposition renderer: composition swapchains, sprite shaders, premultiplied alpha"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rst-core = { path = "../rst-core" }
thiserror = { workspace = true }
tracing = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectComposition",
] }

# Дополнительные фичи windows нужны только примеру и GPU-тестам, не библиотеке
# (Gdi — ради WNDCLASSEXW: поле hbrBackground требует его в windows-rs).
[dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }
# M5c: интеграционный GPU-тест d3d11va — аппаратный декод + zero-copy рендер
# (rst-video отдаёт NV12-текстуры на общем с Device D3D11-девайсе).
rst-video = { path = "../rst-video" }

[lints]
workspace = true

