name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Не используем «latest»: bindgen и layout-проверки rst-video рассчитаны
  # именно на FFmpeg 7.1 (libavcodec 61), поэтому архив и его хэш фиксированы.
  FFMPEG_ARCHIVE: ffmpeg-n7.1-214-g71889a8437-win64-lgpl-shared-7.1.zip
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2025-02-28-13-02/ffmpeg-n7.1-214-g71889a8437-win64-lgpl-shared-7.1.zip
  FFMPEG_SHA256: 7da9ec3c924edbe0b013709a5fa95b0e4851dfce00d31db45066e84ba4741d1b
  FFMPEG_DIR: ${{ runner.temp }}\ffmpeg

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # BtbN-архив — LGPL shared FFmpeg 7.1 с нужными include/lib/bin и
      # проверяемым хэшем, а не непредсказуемый «latest». В самом архиве нет
      # MinGW runtime и libclang, поэтому берём их из MSYS2; его action кэширует
      # установленную среду между прогонами. MINGW64 выбран намеренно: DLL
      # FFmpeg собраны тем же MinGW ABI, а libclang доступен в mingw64/bin.
      - name: MSYS2 (libclang и MinGW runtime)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libwinpthread

      - name: Кэш FFmpeg 7.1
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\ffmpeg
          key: ${{ runner.os }}-ffmpeg-7.1-n7.1-214-g71889a8437

      - name: Скачать и проверить FFmpeg
        shell: pwsh
        run: |
          $requiredVersionHeader = Join-Path $env:FFMPEG_DIR 'include\libavcodec\version_major.h'
          if (-not (Test-Path -LiteralPath $requiredVersionHeader)) {
            $archive = Join-Path $env:RUNNER_TEMP $env:FFMPEG_ARCHIVE
            $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-extract'
            Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $archive
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
            if ($actual -ne $env:FFMPEG_SHA256) {
              throw "FFmpeg SHA-256 не совпал: ожидался $env:FFMPEG_SHA256, получен $actual"
            }
            Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
            $root = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
            if ($null -eq $root) {
              throw 'В архиве FFmpeg не найден корневой каталог'
            }
            New-Item -ItemType Directory -Force -Path $env:FFMPEG_DIR | Out-Null
            Copy-Item -Path (Join-Path $root.FullName '*') -Destination $env:FFMPEG_DIR -Recurse -Force
          }
          foreach ($path in @(
            (Join-Path $env:FFMPEG_DIR 'include'),
            (Join-Path $env:FFMPEG_DIR 'lib'),
            (Join-Path $env:FFMPEG_DIR 'bin'),
            $requiredVersionHeader
          )) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "В FFmpeg отсутствует обязательный путь: $path"
            }
          }

      - name: Переменные FFmpeg и MSYS2
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $mingw = Join-Path $env:MSYS2_LOCATION 'mingw64\bin'
          foreach ($name in @('libclang.dll', 'libiconv-2.dll', 'zlib1.dll', 'libwinpthread-1.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $mingw $name))) {
              throw "MSYS2 не установил обязательную DLL: $name"
            }
          }
          "LIBCLANG_PATH=$mingw" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MINGW_RUNTIME_DIR=$mingw" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=$mingw;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rust stable (MSVC) с clippy и rustfmt
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Кэш cargo
        uses: Swatinem/rust-cache@v2

      - name: Форматирование
        run: cargo fmt --all -- --check

      - name: Clippy (предупреждения = ошибки)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Тесты
        run: cargo test --workspace

      - name: Сборка
        run: cargo build --workspace

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Зависимости интерфейса
        run: pnpm install --frozen-lockfile

      # tauri.conf.json уже ограничивает bundle.target до NSIS; собираем его
      # здесь, но не публикуем релиз — CI хранит только проверяемый артефакт.
      - name: Сборка NSIS-инсталлятора
        run: pnpm tauri build --config crates/resticker/tauri.conf.json --bundles nsis

      - name: Загрузить NSIS-инсталлятор
        uses: actions/upload-artifact@v4
        with:
          name: resticker-nsis-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
